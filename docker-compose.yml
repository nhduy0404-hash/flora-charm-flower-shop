version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flower_shop_app
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: flower_shop
      DB_USERNAME: flower_user
      DB_PASSWORD: flower_password
    depends_on:
      - db
    networks:
      - flower_network

  db:
    image: mysql:8.0
    container_name: flower_shop_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: flower_shop
      MYSQL_USER: flower_user
      MYSQL_PASSWORD: flower_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - flower_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: flower_shop_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root_password
    depends_on:
      - db
    networks:
      - flower_network

volumes:
  db_data:

networks:
  flower_network:
    driver: bridge
